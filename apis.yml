name: Frame Security
description: 'Frame Security is an AI-powered human risk management and security awareness
  platform that defends organizations against human-targeted attacks such as phishing,
  deepfakes, and social engineering. Frame generates personalized security awareness
  training in 70+ languages, hyper-realistic email, voice, and video phishing and deepfake
  simulations built from an organization''s own context, employee risk scoring with
  targeted interventions, automated phishing triage of reported suspicious emails, and
  cross-platform reporting and integrations. The company is backed by Index Ventures
  and raised a $50M round in 2026.'
